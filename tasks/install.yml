---
- name: "Check for squid executable file"
  ansible.builtin.stat:
    path: '/usr/sbin/squid'
  changed_when: false
  register: squid_binary

- name: "Install tasks"
  when: not squid_binary.stat.exists
  block:
    - name: "Install squid package"
      ansible.builtin.package:
        name: "squid"
        state: present
        update_cache: true
      register: __pkg_result
      retries: 12
      delay: 10
      until: __pkg_result is success

    - name: "Creating log directory"
      ansible.builtin.file:
        path: "/var/log/squid/"
        state: directory
        mode: '0755'

    - name: "Create systemd override directory for squid"
      ansible.builtin.file:
        path: /etc/systemd/system/squid.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

- name: "Set OS-level nofile limits for squid user"
  ansible.builtin.copy:
    dest: /etc/security/limits.d/squid.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      squid soft nofile {{ squid_max_filedescriptors }}
      squid hard nofile {{ squid_max_filedescriptors }}
  when: squid_max_filedescriptors is defined

- name: "Set file descriptor limit for Squid"
  ansible.builtin.copy:
    dest: /etc/systemd/system/squid.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      LimitNOFILE={{ squid_max_filedescriptors }}
  when: squid_max_filedescriptors is defined
  notify:
    - "Reload daemon"
    - "Restart squid"

- name: Créer l'arborescence conf.d
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/squid/conf.d
    - /etc/squid/conf.d/sources/inventory_groups
    - /etc/squid/conf.d/sources/groups
    - /etc/squid/conf.d/sources/hosts
    - /etc/squid/conf.d/destinations/global
    - /etc/squid/conf.d/destinations/groups
    - /etc/squid/conf.d/destinations/hosts
    - "{{ squid_error_directory | default('/etc/squid/errors', true) }}"

- name: Include errors
  ansible.builtin.include_tasks: errors.yml
  when: squid_error_directory | length > 0
  tags:
    - errors

- name: Include config
  ansible.builtin.include_tasks: config.yml
  tags:
    - config
    - rules
    - inventory
    - global

- name: "Start and enable squid"
  ansible.builtin.service:
    name: squid
    state: started
    enabled: true
