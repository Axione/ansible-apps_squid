# acl group for the subnets linked to global destinations
squid_localnet_name: "localnet"
# Generate sources ip files from ansible groups
squid_generate_groups_from_inventory: false
# list of urls allowed for all squid_localnet_name
squid_global_domains: []
# list of ips allowed for all squid_localnet_name
squid_global_ips: []
squid_acls: {}
