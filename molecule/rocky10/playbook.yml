---
- name: Run role
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    - name: Get minimal facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'distribution'

  tasks:
    - name: Include role
      ansible.builtin.include_role:
        name: ansible-apps_squid
      vars:
        squid_groups:
          - name: my_group_name
            source_file: my_vms
            sources:
              - 10.1.2.3
            destination_file: access_my_vms
            destinations:
              - .google.fr
          - name: 10.2.5.6
            destinations:
              - .google.com
              - .microsoft.com

        squid_http_access_generate: true
        squid_enable_notes: true
