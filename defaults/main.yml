### access
squid_http_access_generate: false
squid_http_access: {}
#  - {access: 'deny', type: 'CONNECT', scope: '!SSL_ports'}
#Create rules from squid_group info
squid_always_direct: {}
#  - {access: 'allow', value: 'FTP'}
squid_deny_info: ""

### Cache
squid_cache_enable: false
squid_cache_dir: "ufs /var/spool/squid 10240 16 256"
squid_cache_replacement_policy: ""

### Refresh
squid_refresh: ""

### Snmp
squid_snmp_enable: false
squid_snmp_port: 3401
squid_snmp_community: localhost
squid_snmp_incoming_address: 127.0.0.1

### Annotations
#Create annotations from squid_group info
squid_enable_notes: false

### logs
squid_error_directory: ""
squid_log_access: "stdio:/var/log/squid/access.log squid"
squid_log_cache: "/var/log/squid/cache.log"
squid_log_store: "stdio:/var/log/squid/store.log"
squid_logfile_rotate: 14
# logs with annotations
# squid_log_format: !unsafe 'readable_with_rule %{%d/%b/%Y:%H:%M:%S %z}tl %6tr %>a %<la:%<lp %Ss/%03>Hs %<st %rm %ru %>rp %un %Sh/%<A %mt %dt rule=%{rule_matched}note %{User-Agent}>h'
# squid_log_access: "stdio:/var/log/squid/access.log readable_with_rule"

### Various
squid_various: ""
